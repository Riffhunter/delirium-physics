; RoNDelirium settings (read when the game starts). F8 in game toggles the physics reactions on and off.
; Only suspects and civilians: never the player or the SWAT.
; 1 = Delirium drives suspects' and civilians' ragdolls, 0 = the game's own ragdolls.
enabled = 1
; Seconds Delirium drives a dead body before handing it back to the game (once per body, until it's shot again).
duration = 3
; The dying reaction's health: 50-70 staggers a moment and goes down, 30 or less drops at once, 100 and up never falls.
health = 60
; The last seconds of that: Delirium's hold on a dead body eases off, so it goes limp gently when let go (0 = at once).
; Once let go, a corpse stays the game's ragdoll: shot again, it isn't taken back.
fade = 1.5
; Bullets still coming into a dead body Delirium drives restart its clock (duration seconds more), up to dead_max in all.
dead_max = 8
; 1 = a live suspect or civilian who's shot staggers on Delirium's shot reaction (the mesh's own physics: the game
; doesn't ragdoll them, so they keep their weapon). After stagger_time seconds they blend back into the animation
; over blend_out seconds if still on their feet, or the game gets them up if they went down.
stagger = 1
stagger_time = 2.5
blend_out = 0.8
; Only one hurt enough staggers: with more of the game's health left than this (0-1, 0.7 = 70%), a bullet gets the
; game's own flinch and they fight on. 1.01 = every bullet staggers (as before), 0 = never while alive.
react_below = 1.01
; The chance (0-1) a staggering suspect fires back after a bullet: blind, where the gun in their staggering hand points
; (the game's own forced fire), a burst of about fire_burst seconds a moment after the hit. 0 = never.
fire_back = 0.6
fire_burst = 1.0
; 1 = a bullet in a leg always staggers them, however healthy (the leg gives, they kneel or go down).
leg_always = 1
; The health left can also scale the stagger, unhurt (these) to nearly gone (stagger_time, all the body): off as set here,
; since a short stagger, or one that's half the animation's (healthy_blend below 1), twitched and snapped back.
healthy_stagger = 2.5
healthy_blend = 1
healthy_push = 1
weak_push = 1
; Seconds after a stagger an unhurt one shrugs off the next bullet (0 = never).
recover_time = 0
; Still on their feet and settled this many seconds after the hit: back to the animation then, before stagger_time.
settle_after = 1.6
; How stiff a dying body's reaction is (0 = as stiff as a live one): lower, the dying go limp with their arms loose
; instead of curling up with the hands pulled to the neck.
dying_stiffness = 6
; Seconds a hand holds the wound (longer, and where the ragdoll's joints keep it off the wound the arm stays jammed).
grab_time = 1.2
; The shot reaction's health while alive, from the game's own health: stagger_health when unhurt, weak_health when nearly
; gone. Higher fights harder to stay on their feet; the reaction lets them fall below about 100.
stagger_health = 200
weak_health = 70
; How much a bullet in a leg weakens it (0-0.95), for a rifle or shotgun (an SMG 3/4 of it, a pistol 2/3): from about
; 0.5 the leg gives, and they kneel or go down. More bullets in the same leg add up. A wounded leg adds 1.5 s to the stagger.
leg_injury = 0.9
; Likewise an arm: it hangs.
arm_injury = 0.4
; 1 = the walls around found by traces, so Delirium doesn't pull the body into them.
walls = 1
; The bullet's push: the mod's own for the kind of gun (rifles 45 N s, battle rifles 52, SMGs 32, pistols 28,
; shotgun pellets 10) times this.
push_scale = 1
; How each ragdoll body follows Delirium's: 1 takes all of its velocity, lower blends in the game's own motion.
follow = 1
; How fast a body is pulled onto its Delirium part's place (track_pos) and turn (track_rot), per second.
track_pos = 8
track_rot = 12
; Delirium's pelvis this far (m) from the ragdoll's and Delirium is set from the ragdoll again (a wall it didn't know).
resync = 0.4
; Guards against jolts: how much a body's velocity (m/s) and spin (rad/s) may change in one frame.
max_kick = 2
max_spin_kick = 10
; 1 = log each ragdoll Delirium takes and releases to UE4SS.log, with its motion every half second (for bug reports).
log = 0

; For bug reports: 1 = each activation recorded to recordings/ (a few hundred KB each; the newest record_keep kept).
; F9 in game then marks the ones of the last few seconds (and any going on) as _MARK: the ones that looked wrong, never
; deleted. Send the marked files with UE4SS.log (and log = 1 above).
record = 0
record_keep = 300
